<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1763d1" />
    <title>IGS | 고객센터 통합관리 시스템</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark">i</span>
          <div>
            <strong>IGS <small>ADMIN</small></strong
            ><span>Customer Care Platform</span>
          </div>
          <button class="mobile-close" id="closeNav" aria-label="메뉴 닫기">
            ×
          </button>
        </div>
        <div class="nav-caption">WORKSPACE</div>
        <nav id="navigation" aria-label="주 메뉴">
          <button class="nav-link active" data-page="dashboard">
            <span>▦</span> 대시보드</button
          ><button class="nav-link" data-page="consultations">
            <span>▤</span> 상담 관리 <em id="navPending">0</em></button
          ><button class="nav-link" data-page="customers">
            <span>♙</span> 고객 관리</button
          ><button class="nav-link" data-page="agents">
            <span>♧</span> 상담원 관리</button
          ><button class="nav-link" data-page="reports">
            <span>▥</span> 통계 리포트
          </button>
        </nav>
        <div class="nav-caption lower">SYSTEM</div>
        <nav>
          <button class="nav-link" data-page="settings">
            <span>⚙</span> 환경 설정
          </button>
        </nav>
        <div class="sidebar-bottom">
          <div class="support-box">
            <b>관리자 가이드</b>
            <p>고객센터 운영 현황을 한눈에 확인하세요.</p>
            <span>DEMO VERSION 1.0</span>
          </div>
          <div class="side-user">
            <div class="avatar">관</div>
            <div>
              <strong>운영 관리자</strong><small>System Administrator</small>
            </div>
            <span class="online-dot"></span>
          </div>
        </div>
      </aside>
      <div class="main-shell">
        <header class="topbar">
          <div class="top-left">
            <button
              id="menuToggle"
              class="icon-button hamburger"
              aria-label="메뉴 열기"
            >
              ☰
            </button>
            <div class="breadcrumbs">
              IGS ADMIN <span>/</span> <b id="breadcrumb">대시보드</b>
            </div>
          </div>
          <div class="top-right">
            <span class="today" id="todayText"></span
            ><span class="top-divider"></span
            ><button
              class="icon-button notification"
              id="notificationBtn"
              title="알림"
              aria-label="알림 보기"
            >
              🔔<i></i>
            </button>
            <div class="top-avatar">관</div>
            <div class="top-user">
              <strong>운영 관리자</strong><small>ADMIN</small>
            </div>
          </div>
        </header>
        <main id="content" tabindex="-1"></main>
        <footer>
          © 2026 IGS Customer Care Admin · Portfolio Demo
          <span>본 화면의 데이터는 모두 가상 데이터입니다.</span>
        </footer>
      </div>
    </div>
    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="modal-header">
          <div>
            <small>CONSULTATION DETAIL</small>
            <h2 id="modalTitle">상담 상세 정보</h2>
          </div>
          <button id="modalClose" class="icon-button" aria-label="닫기">
            ✕
          </button>
        </div>
        <div id="modalBody"></div>
      </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="js/main.js" defer></script>
  </body>
</html>
